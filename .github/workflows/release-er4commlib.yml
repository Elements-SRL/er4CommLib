name: Release er4commlib

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

# Same physical runner (LENOVO-LUCA / e384-build) as e384commlib's pipelines.
# Sharing the group here means this will queue behind/in front of any other
# workflow using it - intentional given it's a single shared machine.
concurrency:
  group: e384-build-runner
  cancel-in-progress: false

permissions:
  contents: write   # needed for the GitHub Release step

jobs:
  build-lib:
    name: Build er4commlib (static lib)
    runs-on: [self-hosted, e384-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Purge stale CMake cache
        shell: powershell
        run: |
          if (Test-Path "build\lib") {
            Remove-Item -Recurse -Force "build\lib"
          }

      - name: Configure (static lib)
        shell: powershell
        run: |
          cmake -S . -B build\lib -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DBUILD_FOR_LABVIEW=OFF `
            -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}\er4commlib-install\lib"

      - name: Build
        shell: powershell
        run: cmake --build build\lib --config Release

      - name: Install
        shell: powershell
        run: cmake --install build\lib --config Release

      # NOTE: CMAKE_INSTALL_PREFIX above is deliberately outside the checked-out
      # workspace. er4commlib's CMakeLists.txt installs headers via
      # install(DIRECTORY ./ ...) - i.e. it scans the ENTIRE repo root. If the
      # install prefix were a subfolder of the workspace (e.g. under
      # github.workspace), that install step would walk into its own output
      # and copy itself into itself recursively, without end. Keep this
      # pointed at runner.temp (a sibling of the checkout) so that can't happen.
      - name: Upload lib artifact
        uses: actions/upload-artifact@v4
        with:
          name: er4commlib-static
          path: ${{ runner.temp }}\er4commlib-install\lib
          retention-days: 7

  build-labview:
    name: Build er4commlib (LabVIEW wrapper)
    needs: build-lib   # single shared runner - keep these serialized and explicit
    runs-on: [self-hosted, e384-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Purge stale CMake cache
        shell: powershell
        run: |
          if (Test-Path "build\labview") {
            Remove-Item -Recurse -Force "build\labview"
          }

      - name: Configure (LabVIEW wrapper)
        shell: powershell
        run: |
          cmake -S . -B build\labview -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_CONFIGURATION_TYPES=Release `
            -DBUILD_FOR_LABVIEW=ON `
            -DCMAKE_INSTALL_PREFIX="${{ runner.temp }}\er4commlib-install\labview"

      - name: Build
        shell: powershell
        run: cmake --build build\labview --config Release

      - name: Install
        shell: powershell
        run: cmake --install build\labview --config Release

      - name: Upload LabVIEW artifact
        uses: actions/upload-artifact@v4
        with:
          name: er4commlib-labview
          path: ${{ runner.temp }}\er4commlib-install\labview
          retention-days: 7

  package-release:
    name: Package and publish release bundle
    needs: [build-lib, build-labview]
    runs-on: ubuntu-latest
    steps:
      - name: Download static lib artifact
        uses: actions/download-artifact@v4
        with:
          name: er4commlib-static
          path: bundle/lib

      - name: Download LabVIEW artifact
        uses: actions/download-artifact@v4
        with:
          name: er4commlib-labview
          path: bundle/labview

      - name: Zip bundle
        run: |
          cd bundle
          zip -r "../er4commlib-${{ github.ref_name }}.zip" lib labview

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: er4commlib-${{ github.ref_name }}.zip
          generate_release_notes: true
